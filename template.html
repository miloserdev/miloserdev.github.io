  <style>
    /* manpage layout + dark theme, normalized from ronn-ng "man" and "dark" styles */
    :root {
      --bg: #080706;
      --fg: #888;
      --code: #aaa;
      --pre-code: #ddd;
      --strong: #fff;
      --em: #ddd;
      --heading: #fff;
      --link: #fff;
      --decor: #666;
      --ref: #aaa;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #fff;
        --fg: #333;
        --code: #131211;
        --pre-code: #434241;
        --strong: #131211;
        --em: #232221;
        --heading: #030201;
        --link: #0000ff;
        --decor: #999;
        --ref: #434241;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0 auto;
      max-width: 100ex;
      padding: 0 9ex 1ex 4ex;
      background: var(--bg);
      color: var(--fg);
      font: 14px/1.5 monospace;
    }

    @media (max-width: 640px) {
      body {
        padding: 0 2ex 1ex;
      }

      p,
      pre,
      ul,
      ol,
      dl {
        margin-left: 2ex;
      }

      dd {
        margin-left: 4ex;
      }
    }

    /* block rhythm */
    p,
    pre,
    ul,
    ol,
    dl {
      margin: 0 0 20px 8ex;
    }

    h1,
    h2,
    h3 {
      clear: left;
    }

    h1.man-title {
      display: none;
    }

    h2 {
      margin: 22px 0 4px;
      font-size: 16px;
      line-height: 1.25;
    }

    h3 {
      margin: 0 0 0 4ex;
      font-size: 14px;
    }

    h1,
    h2,
    h3 {
      color: var(--heading);
      font-family: inherit;
    }

    h2+pre,
    h3+pre {
      margin-top: 5px;
    }

    ul {
      padding-left: 2ex;
    }

    dt {
      margin: 0;
      clear: left;
    }

    dd {
      margin: 0 0 8px 9ex;
    }

    dd:last-child {
      margin-bottom: 0;
    }

    dl {
      margin-bottom: 20px;
    }

    h3+p {
      margin-bottom: 8px;
    }

    /* inline */
    code,
    kbd,
    samp,
    tt {
      color: var(--code);
      font: inherit;
      font-weight: bold;
    }

    strong,
    b {
      color: var(--strong);
      font-weight: bold;
    }

    em,
    var {
      color: var(--em);
      font-style: italic;
    }

    a,
    a:link,
    a:visited,
    a:hover {
      color: var(--link);
    }

    .man-ref {
      color: var(--ref);
    }

    pre {
      padding: 0 4ex;
      overflow-x: auto;
    }

    pre code {
      color: var(--pre-code);
      font-weight: normal;
    }

    /* header / footer strips */
    ol.man-decor,
    ol.man-decor li {
      margin: 3px 0 10px;
      padding: 0;
      float: left;
      width: 33%;
      list-style: none;
      text-transform: uppercase;
      color: var(--decor);
      letter-spacing: 1px;
    }

    ol.man-decor {
      width: 100%;
    }

    ol.man-decor li.tl {
      text-align: left;
    }

    ol.man-decor li.tc {
      text-align: center;
      letter-spacing: 4px;
    }

    ol.man-decor li.tr {
      text-align: right;
      float: right;
    }

    ol.man-foot {
      margin-top: 24px;
    }
  </style>
