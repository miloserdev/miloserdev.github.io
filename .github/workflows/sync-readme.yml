name: Build and deploy site

on:
  schedule:
    - cron: "17 * * * *"          # hourly fallback
  workflow_dispatch:
  repository_dispatch:
    types: [readme-updated]       # sent by miloserdev/miloserdev on README change
  push:
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 build.py
      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html css js img .well-known CNAME robots.txt llms.txt \
            favicon.ico icon-32.png apple-touch-icon.png \
            c80aad45db0ed108ce56fbb94fe43a86.txt _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true       # never fail the deploy because of a ping
    steps:
      - run: |
          KEY=c80aad45db0ed108ce56fbb94fe43a86
          for host in api.indexnow.org yandex.com www.bing.com; do
            curl -sS -o /dev/null -w "$host -> %{http_code}\n" \
              "https://$host/indexnow?url=https://miloser.dev/&key=$KEY" || true
          done
